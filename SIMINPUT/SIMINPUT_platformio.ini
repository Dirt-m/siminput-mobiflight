; ******************************************************************************************
; SIMINPUT firmware for MobiFlight, board rev2 (RP2040)
;
; Built on the MobiFlight core firmware (MIT, (C) MobiFlight). The core sources are
; fetched into ./src by get_CoreFiles.py at the version below and are not modified.
; Everything SIMINPUT specific lives in this folder.
; ******************************************************************************************

[env_siminput]
custom_core_firmware_version = 3.1.4								; core firmware tag this build is based on
custom_source_folder = SIMINPUT
custom_community_project = SIMINPUT									; folder name inside the zip
custom_zip_filename = siminput_rev2

[env:siminput_rev2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico														; rev2 runs the Pico CircuitPython build: >= 2 MB flash, W25Q080 boot2
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0M
board_build.arduino.earlephilhower.usb_manufacturer = SIMINPUT
board_build.arduino.earlephilhower.usb_product = SIMINPUT (MobiFlight)
lib_ldf_mode = chain+
upload_protocol = mbed
build_flags =
	${env.build_flags}
	'-DMOBIFLIGHT_TYPE="SIMINPUT rev2"'								; must match "MobiFlightType" in the board JSON
	'-DMOBIFLIGHT_NAME="SIMINPUT"'									; default module name in the Connector
	-DMEMLEN_CONFIG=3000											; EEPROM emulation is 4096 bytes, config starts at offset 59
	-DMEMLEN_NAMES_BUFFER=1500
	-DMF_MAX_DEVICEMEM=4000
	-I./SIMINPUT
; Device types SIMINPUT has no pins for. Every GPIO goes to an input jack or the
; expander bus. Dropping steppers also keeps AccelStepper (GPL v3) out of the binary.
build_unflags =
	-DMF_STEPPER_SUPPORT
	-DMF_SERVO_SUPPORT
	-DMF_LCD_SUPPORT
	-DMF_SEGMENT_SUPPORT
	-DMF_OUTPUT_SHIFTER_SUPPORT
	-DMF_INPUT_SHIFTER_SUPPORT
	-DMF_MUX_SUPPORT
	-DMF_DIGIN_MUX_SUPPORT
build_src_filter =
	${env.build_src_filter}
	-<src/MF_Stepper/>
	-<src/MF_Servo/>
	-<src/MF_LCDDisplay/>
	-<src/MF_Segment/>
	-<src/MF_OutputShifter/>
	-<src/MF_InputShifter/>
	-<src/MF_DigInMux/>
	-<src/MF_CustomDevice/>
	+<../SIMINPUT>
lib_deps =
	https://github.com/MobiFlight/Arduino-CmdMessenger#4.2.2
	${env.custom_lib_deps_Pico}
monitor_speed = 115200
extra_scripts =
	${env.extra_scripts}
custom_core_firmware_version = ${env_siminput.custom_core_firmware_version}
custom_community_project = ${env_siminput.custom_community_project}
custom_source_folder = ${env_siminput.custom_source_folder}
custom_zip_filename = ${env_siminput.custom_zip_filename}
